# Nixpacks config for Railway — installs Chromium for the headless web scraper

[phases.setup]
aptPkgs = [
  "chromium",
  # Chromium runtime dependencies
  "libnss3",
  "libatk1.0-0",
  "libatk-bridge2.0-0",
  "libcups2",
  "libdrm2",
  "libxkbcommon0",
  "libxcomposite1",
  "libxdamage1",
  "libxrandr2",
  "libgbm1",
  "libpango-1.0-0",
  "libcairo2",
  # Fonts so pages render correctly
  "fonts-liberation",
  "fonts-noto-color-emoji",
]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm start"
