# Nixpacks config for Railway
#
# Puppeteer's downloaded Chrome bundles its own shared libraries, so no
# extra apt packages are needed. We skip the Chrome download during
# `npm ci` (which can time out) and instead run it explicitly in the
# build phase so it's baked into the image.

[phases.install]
# PUPPETEER_SKIP_DOWNLOAD prevents the postinstall hook from downloading Chrome
# (it would time out). We download Chrome explicitly in the build phase instead.
cmds = ["PUPPETEER_SKIP_DOWNLOAD=true npm ci"]

[phases.build]
cmds = [
  # Download Chrome into ~/.cache/puppeteer (Puppeteer finds it automatically)
  "npx puppeteer browsers install chrome",
  "npm run build",
]

[start]
cmd = "npm start"
