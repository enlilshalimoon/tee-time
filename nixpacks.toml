# Nixpacks config for Railway
# Uses the system Chromium package instead of Puppeteer's bundled Chrome,
# which avoids a ~300MB download during npm install that can time out.

[phases.setup]
aptPkgs = ["chromium"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = ["npm run build"]

[variables]
PUPPETEER_SKIP_DOWNLOAD = "true"
PUPPETEER_EXECUTABLE_PATH = "/usr/bin/chromium"

[start]
cmd = "npm start"
